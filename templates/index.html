<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎨 Danbooru 词条匹配器 - 慕夏风格</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Federo&family=Noto+Serif+SC:wght@500&display=swap" rel="stylesheet">
    <style>
        /* --- 慕夏风格核心 CSS --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cormorant Garamond', 'Noto Serif SC', serif !important;
            background-color: #FDF6E3 !important;
            background-image: radial-gradient(#F4EBD0 2px, transparent 2px) !important;
            background-size: 40px 40px !important;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* 装饰性花纹符号 */
        body::before {
            content: "❦";
            display: block;
            text-align: center;
            font-size: 40px;
            color: #B8860B;
            margin-bottom: 10px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            position: relative;
        }

        /* 标题样式：慕夏海报字体感 */
        .title-section {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            border-bottom: 2px solid #B8860B;
        }

        .title-section h1 {
            color: #8B4513 !important;
            font-family: 'Federo', sans-serif !important;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 2.2em;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .title-section p {
            color: #A0522D;
            font-style: italic;
            margin-top: 10px;
            font-size: 1.1em;
        }

        /* 容器美化：添加古典边框 */
        .main-card {
            border: 3px double #B8860B !important;
            border-radius: 15px !important;
            padding: 30px !important;
            background: rgba(255, 255, 255, 0.5) !important;
            box-shadow: 0 4px 20px rgba(184, 134, 11, 0.2);
            margin-bottom: 20px;
        }

        /* 标签页导航 */
        .tabs {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: linear-gradient(145deg, #D4AF37, #B8860B) !important;
            color: white !important;
            border: 1px solid #3E2723 !important;
            border-radius: 50px !important;
            padding: 12px 30px !important;
            font-family: 'Federo', sans-serif !important;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease !important;
            box-shadow: 3px 3px 10px rgba(0,0,0,0.1);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .tab-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0px 5px 15px rgba(184, 134, 11, 0.4) !important;
        }

        .tab-btn.active {
            background: linear-gradient(145deg, #B8860B, #8B4513) !important;
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.2);
        }

        /* 面板 */
        .panel {
            display: none;
        }

        .panel.active {
            display: block;
            animation: fadeIn 0.4s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 输入区域 */
        .input-section {
            margin-bottom: 25px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        input[type="text"] {
            flex: 1;
            min-width: 250px;
            background-color: rgba(255, 255, 255, 0.8) !important;
            border: 1px solid #839B7D !important;
            border-radius: 8px !important;
            padding: 12px 20px;
            font-size: 1.05em;
            color: #3E2723 !important;
            font-family: 'Cormorant Garamond', 'Noto Serif SC', serif;
            transition: all 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #B8860B !important;
            box-shadow: 0 0 10px rgba(184, 134, 11, 0.3);
        }

        input[type="text"]::placeholder {
            color: #8B7355;
            font-style: italic;
        }

        /* 按钮样式 */
        button {
            background: linear-gradient(145deg, #D4AF37, #B8860B) !important;
            color: white !important;
            border: 1px solid #3E2723 !important;
            border-radius: 50px !important;
            padding: 12px 30px;
            font-family: 'Federo', sans-serif !important;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease !important;
            box-shadow: 3px 3px 10px rgba(0,0,0,0.1);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0px 5px 15px rgba(184, 134, 11, 0.4) !important;
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        /* 结果显示 */
        .result-card {
            background: linear-gradient(135deg, #fffef9 0%, #FDF6E3 100%);
            border: 2px solid #B8860B;
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 12px;
            box-shadow: 0 4px 10px rgba(184, 134, 11, 0.2);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .result-card::before {
            content: '❧';
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 20px;
            color: #B8860B;
            opacity: 0.5;
        }

        .result-card:hover {
            transform: translateX(5px);
            box-shadow: 0 6px 15px rgba(184, 134, 11, 0.3);
            border-color: #D4AF37;
        }

        .result-card h3 {
            color: #8B4513;
            font-size: 1.4em;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            font-family: 'Federo', sans-serif;
        }

        .result-card .chinese {
            color: #A0522D;
            font-size: 1em;
            font-style: italic;
        }

        .result-card .meta {
            display: flex;
            gap: 12px;
            margin-top: 8px;
            font-size: 0.9em;
            color: #8B7355;
            flex-wrap: wrap;
        }

        .result-card .copy-hint {
            opacity: 0.6;
            font-size: 0.8em;
            margin-left: auto;
        }

        .result-card:hover .copy-hint {
            opacity: 1;
            color: #B8860B;
        }

        /* 加载动画 */
        .loading {
            text-align: center;
            padding: 40px;
            color: #8B4513;
            font-size: 1.1em;
        }

        .loading::before {
            content: '❦';
            display: inline-block;
            animation: spin 2s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* 错误提示框：柔和的暗红色 */
        .error {
            border: 1px solid #B07C74 !important;
            background-color: #FADBD8 !important;
            color: #943126 !important;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        /* 成功提示 */
        .success {
            border: 1px solid #7D9B83 !important;
            background-color: #D5F5E6 !important;
            color: #2E7D32 !important;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: #8B7355;
        }

        .empty-state span {
            font-size: 60px;
            display: block;
            margin-bottom: 15px;
        }

        .empty-state p {
            font-size: 1.2em;
            font-style: italic;
        }

        /* 底部装饰 */
        .bottom-ornament {
            text-align: center;
            padding: 20px;
            color: #B8860B;
            font-style: italic;
            border-top: 1px solid #D4AF37;
            margin-top: 30px;
        }

        .bottom-ornament::before {
            content: "❦ ";
        }

        .bottom-ornament::after {
            content: " ❦";
        }

        /* 响应式 */
        @media (max-width: 600px) {
            .title-section h1 {
                font-size: 1.6em;
            }

            .input-group {
                flex-direction: column;
            }

            input[type="text"] {
                min-width: 100%;
            }

            button {
                width: 100%;
            }

            .tabs {
                flex-direction: column;
            }

            .tab-btn {
                width: 100%;
            }
        }

        /* 装饰性角花 */
        .corner-ornament {
            position: absolute;
            font-size: 30px;
            color: #B8860B;
            opacity: 0.6;
        }

        .corner-ornament.top-left {
            top: 10px;
            left: 10px;
        }

        .corner-ornament.top-right {
            top: 10px;
            right: 10px;
        }

        .corner-ornament.bottom-left {
            bottom: 10px;
            left: 10px;
        }

        .corner-ornament.bottom-right {
            bottom: 10px;
            right: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 标题区域 -->
        <div class="title-section">
            <h1>🎨 Danbooru 词条匹配器</h1>
            <p>Art Nouveau Style · 慕夏风格 v2</p>
        </div>

        <!-- 标签页导航 -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('match')">✨ 词条匹配</button>
            <button class="tab-btn" onclick="switchTab('submit')">📝 投稿词条</button>
            <button class="tab-btn" onclick="switchTab('hot')">🔥 热门投稿</button>
        </div>

        <!-- 主内容框 -->
        <div class="main-card">
            <span class="corner-ornament top-left">❧</span>
            <span class="corner-ornament top-right">❧</span>
            <span class="corner-ornament bottom-left">❦</span>
            <span class="corner-ornament bottom-right">❦</span>

            <!-- 面板 1: 词条匹配 -->
            <div id="panel-match" class="panel active">
                <div class="input-section">
                    <div class="input-group">
                        <input 
                            type="text" 
                            id="chineseInput" 
                            placeholder="请输入中文描述，例如：红色眼睛、白色头发、猫耳朵..."
                            onkeypress="if(event.key === 'Enter') matchTags()"
                        >
                        <button onclick="matchTags()" id="matchBtn">✨ 匹配</button>
                    </div>
                </div>
                <div id="matchResults"></div>
            </div>

            <!-- 面板 2: 投稿词条 -->
            <div id="panel-submit" class="panel">
                <div class="input-section submit-form">
                    <div class="input-group" style="flex-direction: column;">
                        <input type="text" id="submitChineseInput" placeholder="📖 中文描述（例如：红色眼睛）">
                        <input type="text" id="submitEnglishTag" placeholder="🔤 英文词条（例如：red_eyes）">
                        <input type="text" id="submitChineseTranslation" placeholder="📝 中文翻译（例如：红眼睛）">
                        <button onclick="submitTag()" id="submitBtn">📤 投稿</button>
                    </div>
                    <div id="submitResult"></div>
                </div>
                <div class="empty-state" style="margin-top: 30px;">
                    <span>🦋</span>
                    <p>投稿您发现的 Danbooru 词条映射！</p>
                    <p>您的贡献将帮助其他人更准确地匹配词条～</p>
                </div>
            </div>

            <!-- 面板 3: 热门投稿 -->
            <div id="panel-hot" class="panel">
                <div id="hotSubmissions">
                    <div class="loading">正在加载热门投稿...</div>
                </div>
            </div>
        </div>

        <!-- 底部装饰 -->
        <div class="bottom-ornament">
            本魔女精心制作 · 饭团魔法师专属
        </div>
    </div>

    <script>
        // 标签页切换
        function switchTab(tabName) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById('panel-' + tabName).classList.add('active');
            event.target.classList.add('active');

            if (tabName === 'hot') {
                loadHotSubmissions();
            }
        }

        // 匹配词条
        async function matchTags() {
            const input = document.getElementById('chineseInput').value.trim();
            const resultsDiv = document.getElementById('matchResults');
            const matchBtn = document.getElementById('matchBtn');

            if (!input) {
                resultsDiv.innerHTML = '<div class="error">🦋 请输入中文描述哦～</div>';
                return;
            }

            matchBtn.disabled = true;
            matchBtn.textContent = '⏳ 匹配中...';
            resultsDiv.innerHTML = '<div class="loading">正在匹配词条...</div>';

            try {
                const response = await fetch('/api/match', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ input: input })
                });

                const data = await response.json();

                if (data.error) {
                    resultsDiv.innerHTML = `<div class="error">❌ ${data.error}</div>`;
                    return;
                }

                if (!data.results || data.results.length === 0) {
                    resultsDiv.innerHTML = '<div class="empty-state"><span>🦋</span><p>没有找到匹配的词条...</p></div>';
                    return;
                }

                let html = '';
                data.results.forEach((result, index) => {
                    const votes = result.votes ? `🔥 ${result.votes}` : '';
                    const source = result.source ? `📚 ${result.source}` : '';
                    
                    html += `
                        <div class="result-card clickable" onclick="copyTag('${result.english}')" style="animation-delay: ${index * 0.1}s" title="点击复制">
                            <h3>
                                <span>${result.english}</span>
                                <span class="chinese">${result.chinese}</span>
                            </h3>
                            <div class="meta">
                                ${votes ? `<span>🔥 ${votes}</span>` : ''}
                                ${source ? `<span>${source}</span>` : ''}
                                <span class="copy-hint">📋 点击复制</span>
                            </div>
                        </div>
                    `;
                });

                resultsDiv.innerHTML = html;

            } catch (error) {
                resultsDiv.innerHTML = `<div class="error">❌ 匹配失败：${error.message}</div>`;
            } finally {
                matchBtn.disabled = false;
                matchBtn.textContent = '✨ 匹配';
            }
        }

        // 投稿词条
        async function submitTag() {
            const chineseInput = document.getElementById('submitChineseInput').value.trim();
            const englishTag = document.getElementById('submitEnglishTag').value.trim();
            const chineseTranslation = document.getElementById('submitChineseTranslation').value.trim();
            const submitResult = document.getElementById('submitResult');
            const submitBtn = document.getElementById('submitBtn');

            if (!chineseInput || !englishTag || !chineseTranslation) {
                submitResult.innerHTML = '<div class="error">❌ 请填写完整信息</div>';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ 提交中...';

            try {
                const response = await fetch('/api/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chinese_input: chineseInput,
                        english_tag: englishTag,
                        chinese_translation: chineseTranslation
                    })
                });

                const data = await response.json();

                if (data.error) {
                    submitResult.innerHTML = `<div class="error">❌ ${data.error}</div>`;
                    return;
                }

                submitResult.innerHTML = '<div class="success">✅ 投稿成功！感谢您的贡献！🦋</div>';
                
                document.getElementById('submitChineseInput').value = '';
                document.getElementById('submitEnglishTag').value = '';
                document.getElementById('submitChineseTranslation').value = '';

            } catch (error) {
                submitResult.innerHTML = `<div class="error">❌ 投稿失败：${error.message}</div>`;
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '📤 投稿';
            }
        }

        // 加载热门投稿
        async function loadHotSubmissions() {
            const container = document.getElementById('hotSubmissions');
            
            try {
                const response = await fetch('/api/submissions');
                const submissions = await response.json();

                if (!submissions || submissions.length === 0) {
                    container.innerHTML = '<div class="empty-state"><span>🦋</span><p>暂无投稿，快来成为第一个投稿的人吧！</p></div>';
                    return;
                }

                let html = '';
                submissions.slice(0, 20).forEach((sub, index) => {
                    html += `
                        <div class="result-card" style="animation-delay: ${index * 0.05}s">
                            <h3>
                                <span>${sub.english_tag}</span>
                                <span class="chinese">${sub.chinese_translation}</span>
                            </h3>
                            <div class="meta">
                                <span>🔥 ${sub.votes} 票</span>
                                <span style="font-style: italic;">"${sub.chinese_input}"</span>
                            </div>
                        </div>
                    `;
                });

                container.innerHTML = html;

            } catch (error) {
                container.innerHTML = `<div class="error">❌ 加载失败：${error.message}</div>`;
            }
        }

        // 复制词条到剪贴板
        function copyTag(tag) {
            navigator.clipboard.writeText(tag).then(() => {
                showToast(`✅ 已复制：${tag}`);
            }).catch(err => {
                const textArea = document.createElement('textarea');
                textArea.value = tag;
                textArea.style.position = 'fixed';
                textArea.style.left = '-9999px';
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    showToast(`✅ 已复制：${tag}`);
                } catch (err) {
                    showToast(`❌ 复制失败：${err.message}`);
                }
                document.body.removeChild(textArea);
            });
        }

        // 显示提示框
        function showToast(message) {
            const toast = document.createElement('div');
            toast.style.cssText = `
                position: fixed;
                top: 20px;
                left: 50%;
                transform: translateX(-50%);
                background: linear-gradient(135deg, #B8860B, #8B4513);
                color: #FDF6E3;
                padding: 12px 24px;
                border-radius: 25px;
                box-shadow: 0 4px 15px rgba(184, 134, 11, 0.4);
                z-index: 9999;
                font-size: 0.95em;
                font-family: 'Federo', sans-serif;
                animation: slideDown 0.3s ease-out;
            `;
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.animation = 'slideUp 0.3s ease-out';
                setTimeout(() => toast.remove(), 300);
            }, 2000);
        }

        // 添加动画样式
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideDown {
                from { transform: translateX(-50%) translateY(-100%); opacity: 0; }
                to { transform: translateX(-50%) translateY(0); opacity: 1; }
            }
            @keyframes slideUp {
                from { transform: translateX(-50%) translateY(0); opacity: 1; }
                to { transform: translateX(-50%) translateY(-100%); opacity: 0; }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>

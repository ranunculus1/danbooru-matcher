<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎨 Danbooru 词条匹配器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        header {
            text-align: center; color: white; margin-bottom: 30px;
        }
        header h1 { font-size: 2em; margin-bottom: 10px; }
        header p { opacity: 0.9; }
        
        .card {
            background: white; border-radius: 15px; padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2); margin-bottom: 20px;
        }
        
        .input-group { margin-bottom: 20px; }
        .input-group label {
            display: block; margin-bottom: 8px; font-weight: 600; color: #333;
        }
        .input-group input, .input-group textarea {
            width: 100%; padding: 12px; border: 2px solid #e0e0e0;
            border-radius: 8px; font-size: 1em;
        }
        .input-group input:focus, .input-group textarea:focus {
            outline: none; border-color: #667eea;
        }
        
        .btn {
            padding: 12px 30px; border: none; border-radius: 8px;
            cursor: pointer; font-size: 1em; font-weight: 600;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102,126,234,0.4); }
        .btn-submit {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }
        
        .results { margin-top: 20px; }
        .result-item {
            background: #f8f9fa; border-radius: 8px; padding: 15px;
            margin-bottom: 10px; border-left: 4px solid #667eea;
        }
        .result-item .english {
            font-size: 1.3em; font-weight: 700; color: #667eea;
        }
        .result-item .chinese {
            color: #666; margin-top: 5px;
        }
        .result-item .meta {
            font-size: 0.85em; color: #999; margin-top: 8px;
        }
        
        .loading { text-align: center; padding: 20px; color: #667eea; }
        .error { background: #f8d7da; color: #721c24; padding: 15px; border-radius: 8px; margin-top: 15px; }
        .success { background: #d4edda; color: #155724; padding: 15px; border-radius: 8px; margin-top: 15px; }
        
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab {
            padding: 10px 20px; background: rgba(255,255,255,0.2);
            border: none; border-radius: 8px; color: white;
            cursor: pointer; font-weight: 600;
        }
        .tab.active { background: white; color: #667eea; }
        
        .hidden { display: none; }
        
        .submissions-list .submission {
            background: #f8f9fa; border-radius: 8px; padding: 12px;
            margin-bottom: 8px; font-size: 0.95em;
        }
        .submission .votes {
            float: right; background: #667eea; color: white;
            padding: 2px 8px; border-radius: 12px; font-size: 0.85em;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎨 Danbooru 词条匹配器</h1>
            <p>输入中文描述，自动匹配 Danbooru 英文词条</p>
        </header>
        
        <div class="tabs">
            <button class="tab active" onclick="switchTab('match')">🔍 匹配词条</button>
            <button class="tab" onclick="switchTab('submit')">📝 投稿词条</button>
            <button class="tab" onclick="switchTab('list')">📊 热门投稿</button>
        </div>
        
        <!-- 匹配词条 -->
        <div id="match-tab" class="card">
            <div class="input-group">
                <label>输入中文描述：</label>
                <input type="text" id="chinese-input" placeholder="例如：红色眼睛、小揪揪、猫耳朵..." />
            </div>
            <button class="btn btn-primary" onclick="matchTags()">🔍 开始匹配</button>
            
            <div id="match-results" class="results"></div>
        </div>
        
        <!-- 投稿词条 -->
        <div id="submit-tab" class="card hidden">
            <h2 style="margin-bottom: 20px;">📝 投稿词条映射</h2>
            <div class="input-group">
                <label>中文输入：</label>
                <input type="text" id="submit-chinese" placeholder="例如：小揪揪" />
            </div>
            <div class="input-group">
                <label>Danbooru 英文词条：</label>
                <input type="text" id="submit-english" placeholder="例如：two side up" />
            </div>
            <div class="input-group">
                <label>中文翻译：</label>
                <input type="text" id="submit-translation" placeholder="例如：两边小辫子" />
            </div>
            <button class="btn btn-submit" onclick="submitTag()">✅ 提交投稿</button>
            <div id="submit-message"></div>
        </div>
        
        <!-- 热门投稿 -->
        <div id="list-tab" class="card hidden">
            <h2 style="margin-bottom: 20px;">📊 热门投稿排行</h2>
            <div id="submissions-list" class="submissions-list">加载中...</div>
        </div>
    </div>
    
    <script>
        let currentMatches = [];
        
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('[id$="-tab"]').forEach(t => t.classList.add('hidden'));
            
            event.target.classList.add('active');
            document.getElementById(tab + '-tab').classList.remove('hidden');
            
            if (tab === 'list') {
                loadSubmissions();
            }
        }
        
        async function matchTags() {
            const input = document.getElementById('chinese-input').value.trim();
            const resultsDiv = document.getElementById('match-results');
            
            if (!input) {
                resultsDiv.innerHTML = '<div class="error">请输入中文内容！</div>';
                return;
            }
            
            resultsDiv.innerHTML = '<div class="loading">🔍 正在匹配中...</div>';
            
            try {
                const response = await fetch('/api/match', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ input: input })
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || '匹配失败');
                }
                
                currentMatches = data.results || [];
                
                if (currentMatches.length === 0) {
                    resultsDiv.innerHTML = '<div class="error">😢 没有找到匹配的词条...</div>';
                    return;
                }
                
                let html = '<h3 style="margin-bottom: 15px;">匹配结果：</h3>';
                currentMatches.forEach((item, index) => {
                    html += `
                        <div class="result-item">
                            <div class="english">${index + 1}. ${escapeHtml(item.english)}</div>
                            <div class="chinese">${escapeHtml(item.chinese)}</div>
                            <div class="meta">
                                来源：${item.source}
                                ${item.votes ? ' | 📊 ' + item.votes + ' 票' : ''}
                            </div>
                        </div>
                    `;
                });
                
                if (data.source === 'ai') {
                    html += `
                        <div style="margin-top: 20px; padding: 15px; background: #e7f3ff; border-radius: 8px;">
                            <strong>💡 提示：</strong> 如果以上匹配不准确，您可以点击"投稿词条"提交正确的映射！
                        </div>
                    `;
                }
                
                resultsDiv.innerHTML = html;
                
            } catch (error) {
                resultsDiv.innerHTML = `<div class="error">❌ 错误：${error.message}</div>`;
            }
        }
        
        async function submitTag() {
            const chinese_input = document.getElementById('submit-chinese').value.trim();
            const english_tag = document.getElementById('submit-english').value.trim();
            const chinese_translation = document.getElementById('submit-translation').value.trim();
            const msgDiv = document.getElementById('submit-message');
            
            if (!chinese_input || !english_tag || !chinese_translation) {
                msgDiv.innerHTML = '<div class="error">请填写完整信息！</div>';
                return;
            }
            
            try {
                const response = await fetch('/api/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chinese_input, english_tag, chinese_translation })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    msgDiv.innerHTML = `<div class="success">✅ ${data.message}</div>`;
                    document.getElementById('submit-chinese').value = '';
                    document.getElementById('submit-english').value = '';
                    document.getElementById('submit-translation').value = '';
                } else {
                    msgDiv.innerHTML = `<div class="error">❌ ${data.error}</div>`;
                }
                
            } catch (error) {
                msgDiv.innerHTML = `<div class="error">❌ 提交失败：${error.message}</div>`;
            }
        }
        
        async function loadSubmissions() {
            const listDiv = document.getElementById('submissions-list');
            
            try {
                const response = await fetch('/api/submissions');
                const submissions = await response.json();
                
                if (submissions.length === 0) {
                    listDiv.innerHTML = '<div style="text-align: center; color: #999; padding: 20px;">还没有投稿，快来投稿第一个词条吧！</div>';
                    return;
                }
                
                let html = '';
                submissions.forEach(sub => {
                    html += `
                        <div class="submission">
                            <span class="votes">📊 ${sub.votes} 票</span>
                            <strong>${escapeHtml(sub.chinese_input)}</strong> → 
                            <span style="color: #667eea;">${escapeHtml(sub.english_tag)}</span>
                            <div style="color: #666; font-size: 0.9em; margin-top: 5px;">
                                ${escapeHtml(sub.chinese_translation)}
                            </div>
                        </div>
                    `;
                });
                
                listDiv.innerHTML = html;
                
            } catch (error) {
                listDiv.innerHTML = `<div class="error">加载失败：${error.message}</div>`;
            }
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // 回车搜索
        document.getElementById('chinese-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                matchTags();
            }
        });
    </script>
</body>
</html>
